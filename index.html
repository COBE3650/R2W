<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Warsaw">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D8DBE0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">

<title>Road to Warsaw · Training dashboard</title>
<script>try{var s=JSON.parse(localStorage.getItem('rtw.settings')||'{}');if(s.app&&s.app.theme==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
<style>:root{
  --accent-glow:rgba(255,45,142,.32);
  --bg:#D8DBE0; --surface:#F6F7F9; --surface2:#ECEEF1; --sunk:#FFFFFF; --raise:#DFE2E7; --ink:#15161A; --muted:#5B606A; --faint:#8C919B; --line:#CBD0D7;
  --accent:#FF2D8E; --accent-deep:#D9006F; --accent-ink:#FFFFFF; --graph:#3A3E46; --flag:#D93A2B; --note:#B86E00; --ok:#138A4A;
  --c-run:#FF2D8E; --c-str:#8B5CF6; --c-hrv:#3D6DB5; --c-rhr:#D9006F; --c-sleep:#7B61FF; --c-fat:#E89A00; --c-lean:#3D6DB5;
  --grid:rgba(21,22,26,.07);
  --sheen:linear-gradient(180deg,#FCFCFD 0%,#EEF0F3 100%);
  --display:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(160deg,#E9EBEE 0%,#D3D7DD 45%,#E2E5E9 70%,#CDD1D7 100%) fixed var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
code{background:rgba(21,22,26,.07);padding:1px 6px;border-radius:5px;font-size:.92em}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
header.top{padding:26px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:12px}
.brand .mark{width:12px;height:30px;background:var(--accent);border-radius:3px;transform:skewX(-14deg)}
.brand small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:6px}
.countdown{display:grid;grid-template-columns:auto auto;align-items:end;column-gap:6px;font-family:var(--display);text-align:right}
.countdown b{font-size:50px;font-weight:700;line-height:.9;color:var(--accent)}
.countdown i{font-style:normal;font-size:16px;color:var(--muted);padding-bottom:4px;text-align:left}
.countdown span{grid-column:1/-1;font-family:var(--body);font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
nav.tabs{position:sticky;top:0;z-index:5;background:rgba(222,225,230,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:0 0 16px 16px;padding-left:4px!important;display:flex;gap:4px;overflow-x:auto;margin:10px 0 22px;padding:10px 0 12px;scrollbar-width:none}
nav.tabs button{background:var(--sheen);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 1px 2px rgba(21,22,26,.08);border:0;padding:8px 15px;border-radius:99px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:14px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected=true]{color:var(--accent-ink);background:var(--accent);box-shadow:0 4px 14px var(--accent-glow);font-weight:600}
h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 2px;line-height:1.15;letter-spacing:.01em}
h3{font-size:15px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px}
section{margin-bottom:30px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--sheen);border-radius:18px;padding:20px 22px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(21,22,26,.06),0 6px 20px rgba(21,22,26,.05)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:stretch}
.hero.hero-2{grid-template-columns:auto 1fr}
.hero>div{background:var(--sheen);border-radius:18px;padding:18px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(21,22,26,.06),0 6px 20px rgba(21,22,26,.05)}
.hero-ring{display:flex;align-items:center;gap:16px;min-width:250px}
.hero-ring>div{display:grid;gap:2px}.hero-ring b{font-size:15px}.hero-ring span{color:var(--muted);font-size:13px}
.ring{width:120px;height:120px;flex:none}
.ring-big{font-family:var(--display);font-size:28px;font-weight:700;fill:var(--ink)}
.ring-small{font-size:10.5px;fill:var(--muted)}
.hero-main{display:flex;flex-direction:column;justify-content:center}
.hero-big{font-family:var(--display);font-size:64px;font-weight:700;line-height:.95;letter-spacing:-.01em}
.hero-big small{font-size:22px;color:var(--muted);margin-left:4px;font-weight:500}
.hero-sub{color:var(--muted);font-size:14px;margin:6px 0 14px}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hero-stats div{background:rgba(21,22,26,.045);border-radius:12px;padding:10px 12px}
.hero-stats span{display:block;font-size:12px;color:var(--muted)}
.hero-stats b{font-family:var(--display);font-size:22px;font-weight:700}
.hero-stats em{font-style:normal;font-size:13px;color:var(--muted);font-family:var(--body);font-weight:400}
.up{color:var(--note)!important}.bad{color:var(--flag)!important}.good{color:var(--ok)!important}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.tile{background:var(--sheen);padding:15px 16px 16px;border-radius:16px;position:relative;min-height:112px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(21,22,26,.06)}
.tile .k{font-size:12.5px;color:var(--muted);padding-right:22px}
.tile .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px}
.tile .v.sm{font-size:24px;padding:5px 0 3px}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.tile>.info{position:absolute;top:12px;right:12px}
.info{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;display:inline-grid;place-items:center;padding:0;flex:none;line-height:1}
.info:hover{color:var(--accent-ink);border-color:var(--accent);background:var(--accent)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:rgba(21,22,26,.07);color:var(--muted);white-space:nowrap;vertical-align:1px}
.chip.good{background:rgba(19,138,74,.12);color:var(--ok)}.chip.bad{background:rgba(217,58,43,.12);color:var(--flag)}.chip.up{background:rgba(184,110,0,.13);color:var(--note)}.chip.ok{background:rgba(19,138,74,.12);color:var(--ok)}
/* flags */
.flags{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.flags li{background:var(--sheen);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(21,22,26,.06);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.flags li span:nth-child(2){flex:1}
.flags li .lv{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:rgba(184,110,0,.13);color:var(--note);flex:none;margin-top:1px}
.flags li.flag .lv{background:rgba(217,58,43,.12);color:var(--flag)}
.flags li.ok .lv{background:rgba(19,138,74,.12);color:var(--ok)}
/* charts */
.chart{position:relative;height:250px}.chart.sm{height:190px}.chart.tall{height:320px}
.legend-note{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend-note i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend-note i.dash{background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 7px)}
.legend-note i.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.legend-note i.xx{font-style:normal;width:auto;height:auto;color:var(--faint);font-weight:700}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px}
details.more ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
/* controls */
.btn{background:#fff;border:0;box-shadow:0 0 0 1px var(--line);border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:500}
.btn:hover{box-shadow:0 0 0 1px var(--faint)}.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 4px 14px var(--accent-glow)}.btn.primary:hover{background:var(--accent-deep)}
.btn.ghost{background:transparent;box-shadow:0 0 0 1px var(--line)}.btn.ghost:hover{box-shadow:0 0 0 1px var(--faint)}
.btn.danger{color:var(--flag)}
.btn.sm{padding:4px 11px;font-size:13px}
.btn.icon{width:36px;padding:8px 0;font-size:17px;line-height:1}
.seg{display:inline-flex;border-radius:99px;overflow:hidden;background:rgba(21,22,26,.06);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 13px;cursor:pointer;color:var(--muted);border-radius:99px;font-size:13.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.weeknav{display:flex;align-items:center;gap:6px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#F4F5F7}
td{padding:8px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
label.f,.f{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;align-items:end}
.scroll input.goal-in{width:88px;padding:4px 9px;text-align:right;border-radius:8px}
.bar{position:relative;height:12px;background:rgba(21,22,26,.09);border-radius:99px;overflow:visible;margin:14px 0 6px}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#FF6FB2,var(--accent));border-radius:99px}
.bar em{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
.big{font-family:var(--display);font-size:46px;font-weight:700;line-height:1}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed #B5BAC3;border-radius:14px;font-size:14px}
.banner{background:var(--sheen);box-shadow:0 1px 2px rgba(21,22,26,.06);border-radius:12px;padding:11px 16px;margin-bottom:18px;font-size:14px;border-left:3px solid var(--note)}
.drop{border:2px dashed #B5BAC3;border-radius:16px;padding:30px;text-align:center;cursor:pointer;background:rgba(255,255,255,.55);transition:border-color .15s}
.drop:hover,.dragging .drop{border-color:var(--accent)}
.drop-icon{font-size:28px;color:var(--accent);line-height:1;margin-bottom:6px}
body.dragging::after{content:"Drop your Apple Health export to import";position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:22px;background:rgba(236,238,241,.92);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;z-index:30;pointer-events:none}
.avail{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.verdict{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.corr-card h3{min-height:40px;align-items:flex-start}
/* split */
.split-total{display:grid;gap:2px;margin-bottom:12px}
.split-total span{font-size:13px;color:var(--muted)}
.split-total b{font-family:var(--display);font-size:48px;font-weight:700;line-height:1}
.split-total b small{font-size:18px;color:var(--muted);font-weight:500;margin-left:3px}
.split-total em{font-style:normal;font-size:12.5px;color:var(--muted)}
.split-bar{display:flex;gap:4px;height:58px;margin:6px 0 12px}
.split-seg{border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;min-width:110px}
.split-seg b{font-family:var(--display);font-size:20px}.split-seg span{font-size:12px;opacity:.85}
.split-seg.fit{background:rgba(255,45,142,.14);color:#C2006A}.split-seg.wt{background:rgba(232,154,0,.16);color:#8F5A00}
.split-seg.neg{background:rgba(21,22,26,.06);color:var(--muted)}
.split-notes{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:grid;gap:6px}
.split-notes b{color:var(--ink)}
/* welcome */
.welcome{padding:30px 32px;background:radial-gradient(120% 140% at 100% 0%,rgba(255,45,142,.2),transparent 55%),var(--sheen)}
.welcome p{max-width:720px}
.onboard{list-style:none;counter-reset:s;padding:0;margin:20px 0 0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.onboard li{counter-increment:s;background:rgba(255,255,255,.65);box-shadow:0 1px 2px rgba(21,22,26,.06);border-radius:14px;padding:16px 16px 16px 56px;position:relative;display:grid;gap:4px}
.onboard li::before{content:counter(s);position:absolute;left:16px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.onboard span{color:var(--muted);font-size:13.5px}
/* guide */
.guide-layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.toc{position:sticky;top:70px;background:var(--sheen);box-shadow:0 1px 2px rgba(21,22,26,.06);border-radius:16px;padding:14px 16px;display:grid;gap:12px;max-height:calc(100vh - 90px);overflow:auto}
.toc-g{display:grid;gap:3px}.toc-g b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.toc a{color:var(--ink);text-decoration:none;font-size:13.5px;padding:2px 0}.toc a:hover{color:var(--accent)}
.guide-group{font-family:var(--display);font-size:20px;margin:20px 0 10px;color:var(--muted)}
.guide-group:first-child{margin-top:0}
.guide details{background:var(--sheen);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(21,22,26,.06);border-radius:14px;margin-bottom:8px;scroll-margin-top:80px;transition:box-shadow .3s}
.guide details.flash{box-shadow:0 0 0 2px var(--accent)}
.guide summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";color:var(--muted);font-size:20px;font-weight:400}
.guide details[open] summary::after{content:"–"}
.gbody{padding:0 20px 16px;color:#33363C;font-size:14.5px}
.gbody ul,.gbody ol{padding-left:20px}.gbody li{margin:5px 0}
.gbody b{color:var(--ink)}
.gbody dl{display:grid;grid-template-columns:200px 1fr;gap:6px 14px}.gbody dt{font-weight:600;color:var(--ink)}.gbody dd{margin:0}
/* overlay, toast */
.overlay{position:fixed;inset:0;background:rgba(40,42,48,.35);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:40}
.overlay[hidden]{display:none}
.overlay .card{min-width:320px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1E2024;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:50;box-shadow:0 8px 30px rgba(21,22,26,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{color:var(--faint);font-size:12.5px;padding:10px 0 40px}
@media (max-width:900px){.hero{grid-template-columns:1fr}.hero-stats{grid-template-columns:repeat(2,1fr)}.guide-layout{grid-template-columns:1fr}.toc{position:static;max-height:none}.gbody dl{grid-template-columns:1fr}}
.brand{background:linear-gradient(180deg,#2A2C31,#5E636C);-webkit-background-clip:text;background-clip:text}
.brand>div{color:transparent}.brand small{color:var(--muted);-webkit-text-fill-color:var(--muted)}
.ring-track{stroke:rgba(21,22,26,.08)}
.hero-big{background:linear-gradient(180deg,#15161A,#4B5059);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero.hero-3{grid-template-columns:1fr 1fr 1.1fr}
.max-card{display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.max-card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--mc,var(--accent))}
.max-card .k{font-size:13px;color:var(--muted);font-weight:600}
.max-big{font-family:var(--display);font-size:68px;font-weight:700;line-height:1;display:flex;align-items:baseline;gap:8px;color:var(--mc,var(--ink))}
.max-big small{font-size:18px;color:var(--muted);font-weight:500}
.max-big .chip{align-self:center;font-family:var(--body)}
.max-card .s{font-size:12.5px;color:var(--muted)}
.max-best{margin-top:auto;padding-top:10px;display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.max-best b{font-family:var(--display);font-size:22px;color:var(--ink)}
.hero-stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.hero.hero-3{grid-template-columns:1fr}}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bc-stats div{background:rgba(21,22,26,.045);border-radius:12px;padding:10px 12px;display:grid;gap:1px}
.bc-stats span{font-size:12px;color:var(--muted)}.bc-stats b{font-family:var(--display);font-size:26px}.bc-stats b small{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:400}.bc-stats em{font-style:normal;font-size:12px;color:var(--muted)}
.imp-rows{display:grid;gap:6px;margin-top:12px}.imp-rows div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;background:rgba(21,22,26,.045);border-radius:10px;padding:8px 12px}.imp-rows span{color:var(--muted);text-align:right}
.form .wide2{grid-column:span 2}@media (max-width:600px){.form .wide2{grid-column:1/-1}}
.countdown b.done{font-size:34px;color:var(--ok)}
.max-adj{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}.max-adj b{color:var(--ink);font-family:var(--display);font-size:16px}
.tile .v.xs{font-size:20px;white-space:normal;padding:6px 0 2px}.tile .v .rc{display:flex;gap:12px;flex-wrap:wrap}.tile .v .rc span{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}.tile .v .rc b{font-family:var(--display);font-size:22px;color:var(--ink);margin-left:3px}
.f>.seg{justify-self:start}
.rc-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rc-big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;color:var(--accent)}.rc-big small{font-size:24px;color:var(--muted);margin-left:2px}
.ob{display:flex;height:30px;border-radius:10px;overflow:hidden;margin:14px 0 8px;gap:2px}
.ob-seg{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;min-width:2px}
.ob-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}.ob-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ===== Dark mode: black with volt yellow-green ===== */
html[data-theme=dark]{
  --bg:#050505; --surface:#121212; --surface2:#1A1A1A; --sunk:#0B0B0B; --raise:#232323; --ink:#F2F2F2; --muted:#9A9A9A; --faint:#626262; --line:#2A2A2A;
  --accent:#D4FF1A; --accent-deep:#B8E000; --accent-ink:#0A0A0A; --accent-glow:rgba(212,255,26,.22); --graph:#D0D0D0; --flag:#FF5A4F; --note:#FFB020; --ok:#3DDC84;
  --c-run:#D4FF1A; --c-str:#A78BFA; --c-hrv:#4DA3FF; --c-rhr:#FF6B8B; --c-sleep:#9B87F5; --c-fat:#FFB020; --c-lean:#4DA3FF;
  --grid:rgba(255,255,255,.07); --sheen:linear-gradient(180deg,#171717 0%,#101010 100%);
  color-scheme:dark;
}
html[data-theme=dark] body{background:radial-gradient(120% 80% at 100% 0%,rgba(212,255,26,.07),transparent 45%) fixed,#050505}
html[data-theme=dark] nav.tabs{background:rgba(5,5,5,.85)}
html[data-theme=dark] nav.tabs button{background:#151515;box-shadow:inset 0 0 0 1px #262626}
html[data-theme=dark] nav.tabs button[aria-selected=true]{background:var(--accent);box-shadow:0 4px 14px var(--accent-glow)}
html[data-theme=dark] .card,html[data-theme=dark] .hero>div,html[data-theme=dark] .tile,html[data-theme=dark] .flags li,html[data-theme=dark] .banner,html[data-theme=dark] .toc,html[data-theme=dark] .guide details{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px #1E1E1E}
html[data-theme=dark] .hero-stats div,html[data-theme=dark] .bc-stats div,html[data-theme=dark] .imp-rows div{background:rgba(255,255,255,.045)}
html[data-theme=dark] .seg{background:rgba(255,255,255,.07)}
html[data-theme=dark] .chip,html[data-theme=dark] code{background:rgba(255,255,255,.09)}
html[data-theme=dark] .bar{background:rgba(255,255,255,.1)}
html[data-theme=dark] .bar i{background:linear-gradient(90deg,#8DB300,var(--accent))}
html[data-theme=dark] .btn{background:#1C1C1C;box-shadow:0 0 0 1px #2E2E2E}
html[data-theme=dark] .btn:hover{box-shadow:0 0 0 1px #555}
html[data-theme=dark] .btn.primary{background:var(--accent);box-shadow:0 4px 14px var(--accent-glow)}
html[data-theme=dark] .btn.ghost{background:transparent;box-shadow:0 0 0 1px #2E2E2E}
html[data-theme=dark] th{background:#141414}
html[data-theme=dark] .info{background:#1A1A1A}
html[data-theme=dark] .empty{border-color:#333}
html[data-theme=dark] .drop{border-color:#333;background:rgba(255,255,255,.03)}
html[data-theme=dark] body.dragging::after{background:rgba(5,5,5,.9)}
html[data-theme=dark] .split-seg.fit{background:rgba(212,255,26,.14);color:var(--accent)}
html[data-theme=dark] .split-seg.wt{background:rgba(255,176,32,.15);color:#FFC24D}
html[data-theme=dark] .split-seg.neg{background:rgba(255,255,255,.06)}
html[data-theme=dark] .welcome{background:radial-gradient(120% 140% at 100% 0%,rgba(212,255,26,.14),transparent 55%),var(--sheen)}
html[data-theme=dark] .onboard li{background:rgba(255,255,255,.04);box-shadow:none}
html[data-theme=dark] .gbody{color:#CFCFCF}
html[data-theme=dark] .ring-track{stroke:rgba(255,255,255,.09)}
html[data-theme=dark] .brand{background:linear-gradient(180deg,#FFFFFF,#9A9A9A);-webkit-background-clip:text;background-clip:text}
html[data-theme=dark] .hero-big{background:linear-gradient(180deg,#FFFFFF,#A8A8A8);-webkit-background-clip:text;background-clip:text}
html[data-theme=dark] #toast{background:#F2F2F2;color:#0A0A0A}
html[data-theme=dark] .overlay{background:rgba(0,0,0,.6)}
html[data-theme=dark] .chip.good,html[data-theme=dark] .chip.ok{background:rgba(61,220,132,.14)}
html[data-theme=dark] .chip.bad{background:rgba(255,90,79,.15)}
html[data-theme=dark] .chip.up{background:rgba(255,176,32,.15)}
.ob-seg.acc{color:var(--accent-ink)}
.wt{margin:2px 0 8px}.wt-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}.wt-row b{color:var(--ink)}
tr.cur td{background:rgba(255,45,142,.06)}html[data-theme=dark] tr.cur td{background:rgba(212,255,26,.06)}
/* iPhone Home Screen app: keep content clear of the notch and home bar */
@media (display-mode: standalone){ .wrap{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))} nav.tabs{top:env(safe-area-inset-top)} #toast{bottom:calc(26px + env(safe-area-inset-bottom))} }
@media (max-width:600px){ .wrap{padding-left:14px;padding-right:14px} .hero-big{font-size:52px} .countdown b{font-size:40px} .brand{font-size:26px} h2{font-size:22px} .card{padding:16px} .tile .v{font-size:28px} .max-big{font-size:54px} .rc-big{font-size:52px} .split-total b{font-size:40px} }

      <p>Weekly targets are calculated from your monthly goals, so you only plan months and still get a number for every week.</p>
      <ul>
        <li><b>How a month is split:</b> each day gets a share of the month’s goal. Normal days count fully. Days in the <b>down week</b>, the last full Monday–Sunday week inside the month, count 70% (60% or 80% selectable). The plan’s first month has no down week, and the week right before the taper isn’t a down week either, because the taper follows.</li>
        <li><b>Taper:</b> the last 2–4 Monday–Sunday weeks before race day step down. With 4 weeks: about 85%, 70%, 55% and 35% of a normal week, the last being race week. The race itself isn’t included in the target.</li>
        <li><b>Weeks spanning two months</b> add up their days’ shares from both months. Every month’s weekly shares add up exactly to its monthly goal.</li>
        <li><b>Start:</b> days before your “Use data from” date don’t get a share, so a goal for a partial first month is spread over the remaining days.</li>
        <li><b>Overrides:</b> type a number for any week on the Running tab; clear it to return to the calculated value. An override changes only that week, so the month’s total may then differ from its goal.</li>
        <li><b>Never make up missed km.</b> If a week falls short, carry on with the next week’s target. The weekly review notes when you run well over a down or taper week, because those easier weeks are when your body absorbs the training.</li>
      </ul>` },
    { id: 'g-model', t: 'The aerobic fitness model', b: `
      <p><b>The question it answers:</b> how fast can you run at a fixed heart rate (default 150 bpm), once you remove things that aren’t fitness?</p>
      <p><b>Physiology behind it:</b></p>
      <ul>
        <li>Heart rate above resting rises roughly in proportion to oxygen use (the % heart‑rate‑reserve ≈ % VO₂‑reserve relationship).</li>
        <li>The oxygen cost of running a kilometre is roughly proportional to body mass. Weighted‑vest studies find metabolic cost rising about 1% per 1% of added mass.</li>
        <li>So for each run, the model converts your speed and average HR into the speed you’d hold at the reference HR and at today’s weight: <code>y = ln(speed) + γ·ln(mass/mass_today) − ln((HR − HR_rest)/(HR_ref − HR_rest))</code>.</li>
      </ul>
      <p><b>What it corrects for:</b> run duration (heart rate drifts up in longer runs), elevation gain per km and temperature when your export contains them, and outliers. These effects are estimated from your own data, not assumed.</p>
      <p><b>How it’s fitted:</b> fitness over time is a smooth curve (a penalised spline with knots every two weeks). How smooth is chosen automatically by generalised cross‑validation. Robust (Huber) regression down‑weights runs that don’t fit, like intervals, GPS glitches or a bad day. 150 bootstrap refits give the 90% bands.</p>
      <p><b>Body weight for each run</b> comes from your smoothed scale trend. Before your first weigh‑in it is interpolated from your profile weight on the date you entered it, so weight you lost before the scale isn’t counted as fitness. After your latest weigh‑in it is held at the last value.</p>
      <p><b>Starting assumptions:</b> the effects of run length, hills and heat begin from physiological priors (about −3% speed per e‑fold of duration, −0.3% per m/km of climb, −0.2% per °C above 15) and are then updated by your data. This matters because long runs and fitness both increase through a training block. Without priors, the model can’t tell them apart and may credit longer runs’ extra heart rate drift to lower fitness, or the reverse. In tests on 40 simulated athletes, 8‑week fitness changes were estimated within about ±0.7 percentage points, and the 90% ranges contained the true value 90% of the time.</p>
      <p><b>Runs it skips:</b> indoor/treadmill, under 3 km or 15 minutes, no heart rate, average HR within 25 bpm of resting or above 97% of max, and implausible paces. The Runs table shows which runs were used and why others weren’t.</p>
      <p><b>Reading the chart:</b> the pink line is fitness alone (everything rescaled to today’s weight). The dashed line is what the model says you’d actually have run then, at your weight on that date. Grey dots are individual runs after standardisation; × marks down‑weighted outliers.</p>
      <p><b>Limits:</b> it’s only as good as the HR data. Wrist HR spikes, or runs where you stopped a lot, add noise. Expect the model to need 10+ qualifying runs over 4+ weeks before it appears, and 2–3 months before trends are trustworthy.</p>` },
    { id: 'g-load', t: 'Training load, fitness and fatigue', b: `
      <p>Each workout’s load is <b>Banister TRIMP</b>: duration × heart‑rate reserve × 0.64·e<sup>1.92·HRR</sup> for men (0.86·e<sup>1.67·HRR</sup> for women, set in Settings), where HRR = (avg HR − resting)/(max − resting). Harder minutes count exponentially more. Workouts without HR get an estimate by sport, and days with logged lifts but no COROS session add a small fixed load.</p>
      <p><b>Fitness</b> is a 42‑day exponentially weighted average of daily load; <b>fatigue</b> is the 7‑day version. Fitness rising steadily with fatigue above it means you’re building. A big gap (fatigue far above fitness) means you’re carrying a lot of recent load.</p>` }
  ]},
  { group: 'Body & recovery', items: [
    { id: 'g-weight', t: 'Trend weight (Kalman smoother)', b: `
      <p>Scale readings swing ±0.5–1 kg day to day from water, food and glycogen. The trend line separates that noise from real change using a <b>Kalman filter and smoother</b> with a level‑and‑slope model:</p>
      <ul>
        <li><b>Which source wins:</b> on any day the Withings file has a weigh‑in, its weight and body fat are used, even if Apple Health also has values. Withings is the original source, and this keeps weight, fat, muscle and water from the same weigh‑in. Apple Health fills days missing from the Withings file, for example days after your latest Withings export. Settings shows how many days came from each.</li>
        <li>If you weigh in more than once a day, the <b>first (morning) reading</b> is used, both from Apple Health and the Withings export, because evening readings include the day’s food and fluids.</li>
        <li>The <b>noise level</b> of your scale and body is estimated from your own readings (shown as “scale noise”).</li>
        <li><b>Outliers</b> more than 4 standard deviations off the trend (someone else on the scale, a typo) are rejected and marked ×, unless they repeat, which means a real change.</li>
        <li>The smoother uses readings before and after each day, so the line doesn’t lag like a moving average.</li>
        <li>The <b>rate</b> (kg/week and %/week) comes from the model’s slope, with a 90% range. If the range includes zero, you can’t yet tell gaining from losing.</li><li>If you haven’t weighed in for more than two weeks, tiles show your last trend value with its date (in amber) instead of a current estimate.</li><li><b>BMI</b> = trend weight ÷ height². It ignores muscle, so for a muscular runner it overstates fatness; body fat and muscle are more informative.</li>
      </ul>
      <p><b>Guideline:</b> for losing fat while training for a marathon and keeping muscle, slow rates (around 0.25–0.75% of body weight per week) are generally recommended. A flag appears only when the whole 90% range is faster than 1%/week.</p>` },
    { id: 'g-comp', t: 'Body fat, fat mass and lean mass', b: `
      <p>Smart scales estimate body fat with bioelectrical impedance, which is strongly affected by hydration, recent exercise and foot contact. Single readings can be off by several percent; trends over weeks are far more useful.</p>
      <p>Each day with both readings gives fat mass = weight × body fat % and lean mass = weight − fat (or the scale’s own lean mass if it reports one). Fat, lean and muscle mass each get their own Kalman trend with a 90% band. Readings taken when body water was out of its normal range are set aside first (see <a href="#" data-toc="g-water">body water</a>).</p>` },
    { id: 'g-muscle', t: 'Muscle mass', b: `<p>Muscle mass comes from the Withings export. It is more specific than lean mass, which also includes water and bone, so it’s the better gauge of whether you are building muscle during the marathon build.</p><ul><li>Smoothed with the same Kalman method as weight, with a 90% band.</li><li>The weekly tile shows the 4‑week change. Green means the whole 90% range is above zero (likely real gain); red means the whole range is below zero.</li><li>The weekly Observations list flags a 4‑week decline whose whole 90% range is below zero, and notes a gain whose whole range is above zero. Without the Withings export it uses lean mass instead.</li><li>Realistic gains while training for a marathon are slow, on the order of a few hundred grams per month. Judge it over months.</li><li>When available, muscle mass replaces lean mass in the Body × Run recomposition and strength‑block views.</li></ul>` },
    { id: 'g-water', t: 'Body water and the hydration filter', b: `<p>Scales estimate body composition by passing a tiny current through you. Water conducts it, so when you’re dehydrated (after a long run, a hot day, alcohol) the scale overestimates body fat and underestimates muscle, and the reverse happens when you’re over‑hydrated.</p><ul><li>Body water % comes from the Withings export (“hydration”, converted to % of weight).</li><li>The dashboard compares each morning with your own normal (61‑day rolling median). Mornings more than 2.5 robust SDs away (at least 0.8 percentage points) are flagged.</li><li>On flagged mornings, the body fat and muscle readings are <b>set aside</b>, excluded from the fat, lean and muscle trends. The weight reading is still used.</li><li>Flagged mornings show as × on the body water and muscle/fat charts, and the weekly review notes them.</li></ul>` },
    { id: 'g-recomp', t: 'Recomposition probability', b: `
      <p>Body recomposition means losing fat and gaining muscle at the same time. Scale readings are noisy, so two numbers like “fat −0.4 kg, muscle +0.2 kg” don’t tell you whether it really happened. This section gives the <b>probability</b> of each of the four possible outcomes: fat down and muscle up (recomposition), both down, both up, or fat up and muscle down.</p>
      <ul>
        <li><b>Changes:</b> fat and muscle changes come from the smoothed (Kalman) trends, measured over the last 4 weeks and over each calendar month (the current month “so far”).</li>
        <li><b>Uncertainty of a change</b> accounts for the start and end estimates being correlated (they share data). Treating them as independent would overstate the noise.</li>
        <li><b>Linked errors:</b> a bioimpedance reading that overstates fat usually understates muscle on the same morning. The dashboard measures how strongly your fat and muscle readings move against each other, and how that carries through to monthly changes, by re‑running both smoothers on simulated noise with your error structure. Ignoring it would make recomposition look either too likely or too unlikely.</li>
        <li><b>Realistic limits:</b> before your data is considered, monthly changes are assumed to be typically within about ±1 kg of fat and ±0.5 kg of muscle. This stops noise from producing impossible “+3 kg muscle in a month” readings. Uncertainty is widened 15% to cover the lag of the smoothed trend.</li>
        <li><b>Accuracy check:</b> on 480 simulated months from two differently built populations of synthetic athletes, stated probabilities matched how often recomposition actually happened to within about 5–7 percentage points on average, and were far more informative than a constant guess.</li>
        <li><b>Reading it:</b> 70%+ is “likely”, 50–70% “probably”. If no outcome reaches 50%, the month is unclear: more weigh‑ins or a longer window are needed. Because fat and muscle errors are linked, an unclear month often splits between “recomposition” and “fat up, muscle down”. That means the scale can’t tell those apart yet, not that both are likely.</li>
        <li>Each month is shown next to its run km and strength sessions, so you can see which training months went with recomposition. Without the Withings export, lean mass is used instead of muscle.</li>
      </ul>
      <p>Needs at least 6 body‑fat and 6 muscle readings in a window of 2 weeks or more. Probabilities are only as good as the scale’s estimates, so trust patterns over several months.</p>` },
    { id: 'g-stand', t: 'Standing heart rate', b: `<p>The Withings scale measures your heart rate while you stand on it at each weigh‑in. Because it’s taken at the same time and in the same position every morning, it’s a consistent daily recovery signal, complementing the overnight resting HR from COROS.</p><ul><li><b>Where it comes from:</b> the Withings export’s bp.csv, which lists the heart rate the scale measured at each weigh‑in. It is matched to your weigh‑ins by exact time, so readings from a blood‑pressure monitor wouldn’t be mixed in. If your Withings account also syncs to Apple Health, the same values arrive that way too.</li><li>The 7‑day average is compared with the median of the previous 60 days.</li><li>More than max(3 bpm, 1 robust SD) above baseline is flagged. Accumulated fatigue, illness, poor sleep, dehydration and alcohol are common causes.</li><li>It is only recognised when the heart‑rate source in Apple Health is Withings.</li></ul>` },
    { id: 'g-bodycheck', t: 'Visceral fat, BMR and metabolic age', b: `<p>Your Withings scale estimates these at every weigh‑in, and the Withings export includes them (in other.csv), so they are imported automatically with each Withings import.</p><ul><li><b>Visceral fat index</b> estimates fat around your organs, a long‑term health marker. It changes slowly, so look at the trend over months. The card shows the latest value and the change versus about a month earlier.</li><li><b>BMR</b> (calories burned at rest) and <b>metabolic age</b> are calculated by Withings from your weight, body composition and age, so they mostly mirror the other charts.</li><li><b>By hand:</b> if a value is missing (for example from a different scale), you can add it manually. On a date with an imported value, the imported value is used.</li></ul>` },
    { id: 'g-hrv', t: 'HRV (heart rate variability)', b: `
      <p>Apple Health stores HRV as SDNN in milliseconds. Higher than <i>your own</i> normal generally means better recovery; values differ hugely between people, so only compare yourself to yourself.</p>
      <ul>
        <li>HRV is analysed on a <b>log scale</b>, standard practice because it is skewed.</li>
        <li><b>Baseline</b> = median of the 60 days before the latest week. <b>Normal range</b> = baseline ± the smallest worthwhile change (0.5 × your robust SD), the approach used in endurance‑sport HRV monitoring.</li>
        <li>The 7‑day average is compared with that range: <i>below normal</i> gets a note, more than 1 SD below gets a flag.</li>
        <li>Needs about 3 weeks of data before the first status appears.</li>
      </ul>
      <p>COROS doesn’t list HRV among the data it syncs to Apple Health, so with your current setup these sections will likely stay empty. They activate automatically if HRV ever appears in an export.</p>` },
    { id: 'g-rhr', t: 'Resting heart rate', b: `<p><b>Where it comes from:</b> some watches (such as an Apple Watch) write a daily resting heart rate to Apple Health; COROS doesn’t, but it does send heart rate samples. For days without a resting HR value, the dashboard estimates one from your watch’s overnight samples: the average of the lowest 20% of readings recorded before 7am (at least 12 samples needed). This is lower than an awake resting HR, but it is measured the same way every night, so its trend is reliable.</p><p>The 7‑day average is compared with the median of the previous 60 days. A rise of more than max(3 bpm, 1 robust SD) is flagged. Common causes: accumulated fatigue, illness coming on, poor sleep, heat, alcohol and stress. A slowly falling resting HR over months is a typical sign of improving aerobic fitness.</p>` },
    { id: 'g-sleep', t: 'Sleep', b: `<p>Sleep per night is attributed to the date you wake up: every segment is assigned by its start time + 12 hours, so segments before and after midnight belong to the same night. Segments starting between 11:00 and 18:00 are treated as naps and not counted. If several sources recorded the same night, the one with the most sleep is used, so time isn’t counted twice. Time awake and time only “in bed” are excluded when stages are available. The weekly check flags an average under 7 hours.</p>` },
    { id: 'g-leanvo2', t: 'VO₂ max and lean‑mass VO₂ max', b: `
      <p>COROS estimates VO₂ max in ml of oxygen per kg of <i>total</i> body weight per minute. Because it divides by total weight, losing fat raises it even when your heart and muscles haven’t changed.</p>
      <p><b>Lean‑mass VO₂ max</b> = VO₂ max × trend weight ÷ smoothed lean mass: oxygen uptake per kg of lean tissue. It only rises with real aerobic adaptation. <b>Absolute VO₂ max</b> (L/min) = VO₂ max × weight ÷ 1000, your total aerobic engine size.</p>
      <p><b>Where the values come from:</b> COROS doesn’t send VO₂ max to Apple Health, so copy the value from the COROS app into the VO₂ max card on Body & recovery, ideally once a month, on any date. If an export does contain a VO₂ max for a date (for example from an Apple Watch), the exported value is used and your entry for that date is ignored; your entries fill all other dates. The chart marks which is which. Once you’ve started entering values, the weekly review reminds you if the last entry is more than 5 weeks old.</p><p>Watch VO₂ max values are estimates from pace and heart rate, not lab tests, and different watches calculate them differently, so compare values from the same watch. Trends matter more than the number. Lean‑mass VO₂ max needs at least 3 VO₂ max values that fall within your scale data.</p>` }
  ]},
  { group: 'Body × Run', items: [
    { id: 'g-split', t: 'Where your pace change came from', b: `
      <p>Using the fitness model, the change in your pace at the reference HR between two dates is split exactly into two parts:</p>
      <ul>
        <li><b>Fitness:</b> how much faster you’d be at the <i>old</i> weight because the model’s fitness curve moved.</li>
        <li><b>Weight:</b> the extra change from going from the old to the new weight at the new fitness level.</li>
      </ul>
      <p>The fitness part has a 90% bootstrap range. The weight part depends on γ, the body‑mass sensitivity. Lab studies support γ ≈ 1 (1% lighter ≈ 1% less energy per km), but those add weight in a vest for one session. Months of real fat loss may help somewhat less, so the result at γ = 0.7 is also shown.</p>
      <p><b>Before the scale:</b> if a window starts before any known weight (no scale data and no dated profile weight), it is shortened to start where weight is known, because weight and fitness can’t be separated before that. If your profile weight is dated before the first weigh‑in, weight in between is interpolated and the split notes this.</p>
      <p><b>When to trust it:</b> the weight part is only meaningful once your trend weight has moved by at least ~1 kg (≈ 4–5 s/km at your pace). Below that, run‑to‑run noise is bigger than the effect, and the dashboard says so. Use longer windows (12 weeks, All) for more reliable splits.</p>` },
    { id: 'g-morning', t: 'Morning‑after effect', b: `<p>Each weigh‑in is compared with the smoothed trend and grouped by what you did the day before: long run, hard session (top 20% of your daily loads), other training or rest. Long and hard sessions make you store extra water with glycogen, so the next morning’s reading is often higher. A 90% bootstrap range shows whether the long‑run vs rest‑day difference is real. Knowing your typical bump stops you from misreading a post‑long‑run weigh‑in as fat gain.</p>` },
    { id: 'g-raterec', t: 'Weight‑change rate vs recovery', b: `<p>Days are grouped by how fast your trend weight was changing (from the Kalman slope), and average resting HR, standing HR (bpm vs baseline) and HRV (% vs baseline, if available) are compared across groups. If faster loss coincides with higher resting or standing HR, or lower HRV, the energy deficit may be affecting recovery from training. The table needs at least two weeks in two different rate groups. For a formal test, see the matching presets in Correlations.</p>` },
    { id: 'g-blocks', t: 'Lean mass vs strength frequency', b: `<p>Your history is cut into consecutive 4‑week blocks, ending today. For each block: change in smoothed lean and fat mass, number of strength sessions (COROS plus logged lift days) and run km. Over months this shows whether blocks with more strength work preserve or build lean mass during the marathon build. Scale lean‑mass estimates are noisy, so look for consistent direction across several blocks.</p>` }
  ]},
  { group: 'Strength', items: [
    { id: 'g-strength', t: 'Max pull‑ups, max dips and other lifts', b: `
      <ul>
        <li>COROS strength mode records your sets, reps and weights in the COROS app, but Apple Health only receives the session itself (time, heart rate, calories). Apple Health has no place for sets and reps, so the dashboard can’t read them from the export.</li>
        <li><b>Log a max set:</b> after a session, pick Pull‑ups or Dips and enter the reps of your best single set at bodyweight, with no added weight and no band or machine assistance. Logging the same exercise twice on one day keeps the higher number.</li>
        <li><b>The cards:</b> the big number is your latest session’s best set, with the change vs the previous session. Below it is your all‑time best and the date you set it. “New best” appears when the latest session beats everything before it.</li>
        <li><b>Charts:</b> best set per session over time; the dotted line marks your all‑time best.</li>
        <li><b>Other lifts (optional):</b> under “Log other lifts”, record weighted exercises to get an estimated 1‑rep max (Epley: kg × (1 + reps/30), best set per day; most reliable for 1–10 reps). Weighted pull‑ups and dips go here and don’t affect the bodyweight max cards.</li>
        <li>Strength sessions per week combine COROS strength workouts with days where you logged a lift but COROS recorded no session.</li>
      </ul>` },
    { id: 'g-relstr', t: 'Weight‑adjusted reps (relative strength)', b: `
      <p>Pull‑ups and dips move your body weight, so losing weight makes them easier without any change in strength. To separate the two, each max set is converted to the reps you’d expect at <b>today’s</b> weight, holding your absolute strength constant.</p>
      <ul>
        <li>Absolute strength is estimated with the Epley formula on the mass you move: body weight × (1 + reps ÷ 30).</li>
        <li>Reps at today’s weight = 30 × (that strength ÷ today’s weight − 1). Example: 5 reps at 85 kg is about 6.3 reps at 82 kg.</li>
        <li>Pull‑ups and dips don’t move your entire body weight (hands and forearms stay put), but that fraction cancels out of the calculation, so it doesn’t affect the result.</li>
        <li>The card shows your latest and best sets adjusted to today’s weight. The chart adds a dashed “at today’s weight” line next to your actual reps. If the dashed line rises, you got stronger, not just lighter.</li>
        <li>Body weight per session comes from your smoothed scale trend (or your profile weight before the scale). Epley is least accurate above ~12 reps, so treat high‑rep adjustments as approximate.</li>
      </ul>` }
  ]},
  { group: 'Correlations', items: [
    { id: 'g-corr', t: 'How correlations are tested', b: `
      <p>By default every paired day in your history is used (the <b>All</b> range); 90d, 6m and 1y restrict the analysis to recent data. Metrics named “7‑day avg” or “7‑day sum” are rolling values for each day, not a shorter analysis window. Each point is one day: X on that day and Y on the same day, next day or 2 days later. Several safeguards stop it from finding patterns that aren’t there:</p>
      <ul>
        <li><b>Spearman rank correlation (ρ)</b> instead of plain correlation, so single extreme days can’t drive the result.</li>
        <li><b>Remove slow trends</b> (on by default): each metric is compared with its own 61‑day rolling median first. Otherwise two things that both drift over months, like fitness rising while weight falls, look correlated even when day‑to‑day they’re unrelated.</li>
        <li><b>Honest uncertainty:</b> daily data is autocorrelated (today resembles yesterday), so 180 days are not 180 independent observations. The 90% interval is the wider of a moving‑block bootstrap and a Fisher interval using the effective sample size. The “≈ N independent” note shows that number.</li>
        <li>The verdict says <i>reliable</i> only if the whole 90% interval is on one side of zero. Size labels: under 0.1 negligible, 0.1–0.3 weak, 0.3–0.5 moderate, above 0.5 strong.</li>
      </ul>
      <p>Correlation is not causation, and with 8 presets plus custom pairs, roughly 1 in 10 null relationships can look reliable by chance. Treat findings as hypotheses to test, not facts.</p>` }
  ]},
  { group: 'Settings, data and privacy', items: [
    { id: 'g-goal', t: 'Renaming the dashboard and setting your next goal', b: `
      <ul>
        <li><b>Appearance:</b> Light mode (silver with hot pink) or Dark mode (black with volt yellow‑green). The choice is remembered and applies to every tab and chart.</li>
        <li><b>Dashboard name</b> changes the title at the top of the page and in the browser tab.</li>
        <li><b>Goal time</b> can be typed as h:mm:ss (4:30:00) or mm:ss (25:00). Two‑part times are read as whichever makes sense for the distance (4:30 for a marathon = 4 h 30; 25:00 for a 5 km = 25 min), and the field is rewritten in full so you can see how it was read. Times implying a pace faster than 2:50/km or slower than 15:00/km ask for confirmation.</li>
        <li><b>Changing the distance converts your goal time</b> to the equivalent for the new distance using Riegel’s formula, T₂ = T₁ × (D₂ / D₁)^1.06 (for example, 4:30:00 for a marathon ≈ 2:10:00 for a half, 58:45 for 10 km and 28:10 for 5 km). A message tells you what it changed to. Overwrite it with your real target.</li>
        <li><b>Goal race, date, distance and goal time</b> drive the countdown, training phase, goal pace (goal time ÷ distance), goal‑pace HR, the goal‑pace line on the fitness chart and the ramp suggestion. The goal summary under the fields shows the pace and phase lengths it is using.</li>
        <li><b>Plan start</b> is where the monthly goals table and the race ring begin.</li>
        <li><b>After a race:</b> the header shows it as done. Enter the next race and distance, then set Plan start to today. Every run, weigh‑in, lift, body check and past monthly goal stays; the fitness model and all trends simply continue.</li>
      </ul>` },
    { id: 'g-gamma', t: 'Model settings (γ and reference HR)', b: `<ul><li><b>γ (body‑mass sensitivity):</b> 1.0 follows weighted‑load studies; 0.7 is a conservative assumption that real fat loss helps less. It changes the weight part of the split and the weight standardisation in the fitness model.</li><li><b>Reference HR:</b> the heart rate at which pace is reported (default 150 bpm). Pick something typical of your steady runs; 75–80% of max is common.</li><li><b>Max HR:</b> defaults to 208 − 0.7 × age. If your workouts show a higher maximum, Settings offers to use it. A correct max HR improves load, zones and the model.</li></ul>` },
    { id: 'g-backup', t: 'Backup, restore and privacy', b: `
      <ul>
        <li>Everything is stored in this browser’s local storage on this computer. Nothing is uploaded, and the page works without internet.</li>
        <li><b>Download backup</b> saves lifts, goals, settings and (optionally) the imported health data as a .json file. <b>Restore</b> loads it back, for example on a new computer or browser.</li>
        <li>Clearing browser data, using a private window, or switching browsers starts empty. Restore from a backup in those cases.</li>
        <li>Very large exports may exceed browser storage. If that happens a banner tells you; the data still works until you close the page.</li>
      </ul>` },
    { id: 'g-trouble', t: 'Troubleshooting', b: `
      <ul>
        <li><b>“export.xml not found” or the zip fails:</b> unzip it on your computer and choose <code>export.xml</code> from the <i>apple_health_export</i> folder.</li>
        <li><b>A data type shows “none”:</b> check that the source app (COROS or your scale) has Apple Health permission for that type, open the Health app to confirm the data appears there, then export again.</li>
        <li><b>Duplicate workouts:</b> if two sources record the same session, or the same session appears in two imports, it is kept once: the version with the most data (HR, distance) wins. See <a href="#" data-toc="g-merge">how imports are merged</a>.</li>
        <li><b>Steps or sleep look doubled:</b> they shouldn’t. For each day or night the source with the highest total is used rather than adding sources together.</li>
        <li><b>The fitness model is missing:</b> it needs 10+ outdoor runs with HR over 4+ weeks. The Runs table shows why individual runs were excluded.</li>
        <li><b>Numbers look off after changing max HR or resting HR:</b> that’s expected. Load and the model are recomputed from your settings.</li>
        <li><b>Data disappeared:</b> you probably opened the file from a different folder or browser. Move it back or restore a backup.</li>
      </ul>` },
    { id: 'g-glossary', t: 'Glossary', b: `
      <dl>
        <dt>90% range / interval</dt><dd>The range that contains the true value with about 90% probability, given the data and model.</dd>
        <dt>Bootstrap</dt><dd>Refitting a model many times on resampled data to see how much the answer varies.</dd>

  const S = state.settings, ref = weightAt(A, S, A.end), real = A.wFirstN != null, wt = {}, adj = {};

function overlay(msg, p) { const o = $('#overlay'); if (msg == null) { o.hidden = true; return; } o.hidden = false; o.innerHTML = `<div class="card" role="status"><b>${msg}</b><div class="bar"><i style="width:${Math.round((p || 0) * 100)}%"></i></div><div class="sub">${p != null ? Math.round(p * 100) + '%' : ''} · large exports can take a minute</div></div>`; }
async function readXml(file, parser) {
  const r = file.stream().getReader(), dec = new TextDecoder(); let bytes = 0, last = 0;
  for (;;) { const { done, value } = await r.read(); if (done) break; bytes += value.length; parser.push(dec.decode(value, { stream: true })); if (bytes - last > 4e6) { last = bytes; overlay('Reading export.xml…', bytes / file.size); await new Promise(res => setTimeout(res)); } }
  parser.push(dec.decode());
}
function readZip(file, parser) {
  return new Promise(async (resolve, reject) => {
    let found = false, finished = false; const dec = new TextDecoder();
    const uz = new fflate.Unzip(f => {
      if (!/(^|\/)export\.xml$/i.test(f.name) || found) return;
      found = true;
      f.ondata = (err, chunk, final) => { if (err) { reject(err); return; } parser.push(dec.decode(chunk, { stream: !final })); if (final) finished = true; };
      f.start();
    });

    try {
      const r = file.stream().getReader(); let bytes = 0, last = 0;
      for (;;) { const { done, value } = await r.read(); if (done) { uz.push(new Uint8Array(0), true); break; } bytes += value.length; uz.push(value); if (finished) { r.cancel(); break; } if (bytes - last > 2e6) { last = bytes; overlay('Unzipping and reading…', bytes / file.size); await new Promise(res => setTimeout(res)); } }
    } catch (e) { reject(e); return; }
    if (!found) reject(new Error('export.xml not found inside the zip.')); else if (!finished) reject(new Error('The zip ended early or uses an unsupported format. Unzip it and choose export.xml instead.')); else resolve();
  });
}
async function zipFirstName(file) { const b = new Uint8Array(await file.slice(0, 4096).arrayBuffer()); if (b[0] !== 0x50 || b[1] !== 0x4b) return null; const n = b[26] | (b[27] << 8); return new TextDecoder().decode(b.slice(30, 30 + n)); }

  if (/\.csv$/i.test(f.name)) return 'withings';
  if (/\.zip$/i.test(f.name)) { const nm = (await zipFirstName(f)) || ''; if (/apple_health_export|export\.xml|export_cda|electrocardiograms|workout-routes/i.test(nm)) return 'apple'; if (/\.csv$/i.test(nm) || f.size < 40e6) return 'withings-zip'; return 'apple'; }

}

  const model = buildModel(parser.finish());
  if (!Object.keys(model.daily).length && !model.workouts.length) throw new Error(`${file.name}: no supported Apple Health records found.`);
  const fdk = k => k ? fd(keyToNum(k), { day: 'numeric', month: 'short', year: 'numeric' }) : '–';

  return `Apple Health merged: ${stats.added} new day${stats.added === 1 ? '' : 's'}, ${stats.updated} refreshed${stats.keptDays ? `, ${stats.keptDays} older day${stats.keptDays === 1 ? '' : 's'} kept from earlier imports` : ''}${stats.dupes ? `, ${stats.dupes} duplicate workout${stats.dupes === 1 ? '' : 's'} merged` : ''}`;

async function importWithings(file, zipped, extraFiles = []) {

  if (zipped) {
    const files = fflate.unzipSync(new Uint8Array(await file.arrayBuffer()), { filter: f => /\.csv$/i.test(f.name) });
    const names = Object.keys(files), dec = n => new TextDecoder().decode(files[n]);

    for (const n of cands) { const t = dec(n); if (parseWithings(t, state.settings.profile.weight)) { text = t; break; } }
    if (!text) throw new Error(`${file.name}: no Withings weight CSV found inside the zip.`);
    const bpN = names.find(n => /(^|\/)bp\.csv$/i.test(n)), otN = names.find(n => /(^|\/)other\.csv$/i.test(n));

    if (newLast && oldLast && newLast < oldLast && !confirm(`${file.name} ends on ${fdk(newLast)}, but you already have Withings data up to ${fdk(oldLast)}.\n\nMerge it anyway? Days after ${fdk(newLast)} are kept; days it covers are replaced by this older file.`)) return 'Withings skipped (older file)';
  }

async function importFiles(list) {
  const files = [...(list || [])]; if (!files.length) return;

    const kinds = await Promise.all(files.map(detectKind));
    const csvs = files.filter((f, i) => kinds[i] === 'withings'), extra = csvs.filter(f => /(^|[\\/])(bp|other)\.csv$/i.test(f.name)), mainCsv = csvs.filter(f => !extra.includes(f));
    const order = files.map((f, i) => [f, kinds[i]]).filter(([f, k]) => !(k === 'withings' && (extra.includes(f) || (mainCsv.length > 1 && !/weight/i.test(f.name))))).sort((a, b) => (a[1] === 'apple' ? 0 : 1) - (b[1] === 'apple' ? 0 : 1));
    if (!order.length && extra.length) throw new Error('Add weight.csv (or the whole Withings zip) together with bp.csv / other.csv.');
    for (const [f, k] of order) {
      if (k === 'apple') done.push(await importApple(f));
      else if (k === 'withings' || k === 'withings-zip') done.push(await importWithings(f, k === 'withings-zip', extra));
      else throw new Error(`${f.name}: not recognised. Use the Apple Health export (zip or export.xml) or the Withings export (zip or CSV).`);
    }
    state.healthUnsaved = state.healthUnsaved && true;
  } catch (e) { overlay(null); render(); alert('Import failed: ' + (e && e.message || e)); return; }
  state.tab = 'week'; render(); overlay(null); window.scrollTo(0, 0);
  toast(done.join(' · ') + '.');
}

/* ===== Goal distance changes ===== */
function setDistance(nd) {
  const R = state.settings.race, od = +R.distance || 42.195, p = parseGoal(R.goal, od);
  R.distance = nd; let msg = `Race distance set to ${distName(nd)}.`;
  if (p && Math.abs(nd - od) > 0.01) { // a goal time belongs to its distance: convert it to the equivalent time (Riegel)
    const conv = riegel(p.sec, od, nd), rounded = conv >= 3600 ? Math.round(conv / 60) * 60 : Math.round(conv / 5) * 5;
    R.goal = fmtHMS(rounded); msg = `Distance set to ${distName(nd)}. Goal time converted to ${R.goal} (${fmtPace(rounded / nd)}/km), equivalent to ${fmtHMS(p.sec)} for the ${distName(od)}. Change it if your target is different.`;
  }
  persist('settings'); render(); toast(msg);
}

/* ===== Events ===== */
function openGuide(id) {
  state.tab = 'guide'; render();
  const el = document.getElementById(id); if (!el) return;
  if (el.tagName === 'DETAILS') el.open = true;
  const p = el.parentElement && el.parentElement.closest('details'); if (p) p.open = true;
  setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1800); }, 30);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,a,#drop'); if (!t) return;
  const d = t.dataset;
  if (d.guide) { e.preventDefault(); openGuide(d.guide); return; }
  if (d.tab) { state.tab = d.tab; render(); window.scrollTo(0, 0); return; }
  if (d.goto) { e.preventDefault(); state.tab = d.goto; render(); window.scrollTo(0, 0); return; }
  if (d.toc) { e.preventDefault(); const el = document.getElementById(d.toc); if (el) { if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
  if (d.expand) { document.querySelectorAll('.guide details').forEach(x => x.open = d.expand === 'open'); return; }
  if (t.id === 'drop') { $('#file').click(); return; }
  if (d.range) { state.range = +d.range; render(); return; }
  if (d.cdays) { state.corrDays = +d.cdays; render(); return; }
  if (d.split) { state.splitWin = +d.split; render(); return; }
  if (d.planDown) { state.settings.plan.downPct = +d.planDown; persist('settings'); render(); toast(`Down weeks set to ${d.planDown}% of a normal week.`); return; }
  if (d.planTaper) { state.settings.plan.taperWeeks = +d.planTaper; persist('settings'); render(); toast(`Taper set to ${d.planTaper} weeks.`); return; }
  if (d.themeSet) { state.settings.app.theme = d.themeSet; persist('settings'); render(); toast((d.themeSet === 'dark' ? 'Dark' : 'Light') + ' mode on.'); return; }
  if (d.dist) { setDistance(+d.dist); return; }
  if (d.gamma) { state.settings.model.gamma = +d.gamma; persist('settings'); render(); toast('Model refitted with γ = ' + d.gamma + '.'); return; }
  if (d.maxex) { state.maxEx = d.maxex; document.querySelectorAll('[data-maxex]').forEach(b => b.classList.toggle('on', b.dataset.maxex === d.maxex)); return; }
  if (d.delVo2) { state.logs.vo2 = state.logs.vo2.filter(e => String(e.id) !== d.delVo2); persist('logs'); render(); toast('VO₂ max entry deleted.'); return; }
  if (d.delBc) { state.logs.body = state.logs.body.filter(b => String(b.id) !== d.delBc); persist('logs'); render(); toast('Body check deleted.'); return; }
  if (d.delLift) { state.logs.lifts = state.logs.lifts.filter(l => String(l.id) !== d.delLift); persist('logs'); render(); toast('Lift deleted.'); return; }
  switch (d.act) {
    case 'pick': $('#file').click(); break;
    case 'wk-prev': state.weekOffset++; render(); break;
    case 'wk-next': state.weekOffset = Math.max(0, state.weekOffset - 1); render(); break;
    case 'wk-now': state.weekOffset = 0; render(); break;
    case 'ramp': { const has = Object.keys(state.goals).some(k => /^\d{4}-\d{2}$/.test(k) && k >= monthKey(A.end)); if (has && !confirm('Replace goals from this month onward with a suggested ramp?')) break; Object.assign(state.goals, suggestRamp(A, state.settings)); persist('goals'); render(); toast('Suggested ramp filled in. Edit any month.'); break; }
    case 'goals-clear': if (confirm('Clear all monthly goals and weekly overrides?')) { state.goals = {}; persist('goals'); render(); } break;
    case 'max-add': {
      const ex = state.maxEx || 'Pull-up', reps = Math.round(+$('#mx-reps').value), date = $('#mx-date').value;
      if (!(reps > 0) || !date) { toast('Enter the reps from your best set.'); break; }
      state.logs.lifts.push({ id: Date.now(), date, ex, sets: 1, reps, kg: 0, max: true }); persist('logs'); render();
      toast(`Saved: ${reps} ${ex === 'Dip' ? 'dips' : 'pull‑ups'} on ${fd(keyToNum(date))}.`); break;
    }
    case 'lf-add': {
      const ex = $('#lf-ex').value.trim(), sets = +$('#lf-sets').value, reps = +$('#lf-reps').value, kg = +$('#lf-kg').value || 0, date = $('#lf-date').value;
      if (!ex || !(sets > 0) || !(reps > 0) || !date) { toast('Fill in exercise, sets and reps.'); break; }
      state.logs.lifts.push({ id: Date.now(), date, ex, sets, reps, kg }); persist('logs'); render();
      $('#lf-date').value = date; toast(`Added ${ex} ${sets} × ${reps}${kg ? ' @ ' + kg + ' kg' : ''}.`); break;
    }
    case 'use-max': state.settings.profile.hrMax = Math.round(A.observedMaxHR); persist('settings'); render(); toast('Max HR updated.'); break;
    case 'demo': state.health = demoHealth(); state.withings = demoWithings(state.health); persist('health'); persist('withings'); state.tab = 'week'; render(); window.scrollTo(0, 0); toast('Demo data loaded.'); break;
    case 'health-clear': if (confirm('Remove imported Apple Health and Withings data? Lifts, body checks, goals and settings stay.')) { state.health = null; state.withings = null; [LS.health, LS.withings].forEach(k => { try { localStorage.removeItem(k); } catch (_) { } }); render(); } break;
    case 'vo2-add': {
      const date = $('#vo2-date').value, v = numOrNull($('#vo2-val').value);
      if (!date || !(v >= 15 && v <= 95)) { toast('Enter a VO₂ max between 15 and 95.'); break; }
      state.logs.vo2 = state.logs.vo2.filter(e => e.date !== date); state.logs.vo2.push({ id: Date.now(), date, v }); persist('logs'); render();
      toast(A.vo2Manual.has(keyToNum(date) - A.start) ? `VO₂ max ${v} saved for ${fd(keyToNum(date))}.` : `Saved, but your export already has a VO₂ max for ${fd(keyToNum(date))}, so that value is used.`); break;
    }
    case 'bc-add': {
      const date = $('#bc-date').value, vfi = numOrNull($('#bc-vfi').value), bmr = numOrNull($('#bc-bmr').value), mage = numOrNull($('#bc-mage').value);
      if (!date || (vfi == null && bmr == null && mage == null)) { toast('Enter at least the visceral fat index.'); break; }
      state.logs.body = state.logs.body.filter(b => b.date !== date); state.logs.body.push({ id: Date.now(), date, vfi, bmr, mage }); persist('logs'); render(); toast('Body check saved.'); break;
    }
    case 'backup': {
      const inc = $('#bk-health').checked, data = { app: 'road-to-warsaw', version: 3, exportedAt: new Date().toISOString(), settings: state.settings, logs: state.logs, goals: state.goals, health: inc ? state.health : undefined, withings: inc ? state.withings : undefined };
      const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = `training-backup-${todayKey()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Backup downloaded.'); break;
    }
    case 'restore': $('#restore').click(); break;
    case 'wipe': if (confirm('Erase all lifts, goals, settings and health data from this browser? This cannot be undone.')) { Object.values(LS).forEach(k => { try { localStorage.removeItem(k); } catch (_) { } }); location.reload(); } break;
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'file') { importFiles(t.files); t.value = ''; return; }
  if (t.id === 'restore') {
    const f = t.files[0]; t.value = ''; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (d.app !== 'road-to-warsaw') throw new Error('Not a backup from this app.');
      if (!confirm('Replace current lifts, goals and settings with this backup?')) return;
      state.settings = mergeSettings(d.settings); state.logs = { lifts: (d.logs && d.logs.lifts) || [], body: (d.logs && d.logs.body) || [], vo2: (d.logs && d.logs.vo2) || [] }; state.goals = d.goals || {}; if (d.health) state.health = d.health; if (d.withings) state.withings = d.withings;
      ['settings', 'logs', 'goals'].forEach(persist); if (d.health) persist('health'); if (d.withings) persist('withings'); render(); toast('Backup restored.');
    } catch (err) { alert('Restore failed: ' + err.message); }
    return;
  }
  if (t.id === 'detrend') { state.detrend = t.checked; render(); return; }
  if (t.dataset.wgoal) { const v = numOrNull(t.value), k = 'w:' + t.dataset.wgoal; if (v == null || v < 0) delete state.goals[k]; else state.goals[k] = v; persist('goals'); render(); toast(v == null ? 'Week back to the calculated target.' : `Week of ${fd(keyToNum(t.dataset.wgoal))} set to ${v} km.`); return; }
  if (t.dataset.goal) { const v = numOrNull(t.value); if (v == null || v <= 0) delete state.goals[t.dataset.goal]; else state.goals[t.dataset.goal] = v; persist('goals'); render(); return; }
  if (t.dataset.set) {
    const [g, k] = t.dataset.set.split('.'); let v = t.type === 'number' ? numOrNull(t.value) : t.value.trim();
    if (k === 'goal') { const p = parseGoal(v, +state.settings.race.distance || 42.195);
      if (!p) { alert('Use h:mm:ss (e.g. 4:30:00) or mm:ss (e.g. 25:00).'); t.value = state.settings.race.goal; return; }
      if (!p.plausible && !confirm(`${fmtHMS(p.sec)} for the ${distName(+state.settings.race.distance || 42.195)} is ${fmtPace(p.sec / (+state.settings.race.distance || 42.195))}/km, which looks implausible. Keep it anyway?`)) { t.value = state.settings.race.goal; return; }
      v = fmtHMS(p.sec); }
    if (v == null && t.type === 'number' && k !== 'hrRest') v = DEFAULT_SETTINGS[g][k];
    if (g === 'data' && k === 'from') { state.settings.data.from = v || ''; persist('settings'); render(); toast(v ? `Using file data from ${fd(keyToNum(v), { day: 'numeric', month: 'short', year: 'numeric' })}.` : 'Using all file data.'); return; }
    if (k === 'distance') { if (!(v > 0)) v = DEFAULT_SETTINGS.race.distance; setDistance(v); return; }
    if (g === 'profile' && k === 'weight' && v !== state.settings.profile.weight) state.settings.profile.weightDate = todayKey();
    if (k === 'title' && !v) v = DEFAULT_SETTINGS.app.title;
    state.settings[g][k] = v; persist('settings'); render(); toast('Saved.'); return;
  }
  if (t.id === 'liftEx') { state.liftEx = t.value; render(); return; }
  if (t.id === 'cx' || t.id === 'cy' || t.id === 'clag') { state.corr = { x: $('#cx').value, y: $('#cy').value, lag: +$('#clag').value }; render(); }
});
let dragDepth = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); importFiles(e.dataTransfer.files); });
document.addEventListener('keydown', e => { if (e.target.id === 'drop' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#file').click(); } });

Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
render();
</script>
